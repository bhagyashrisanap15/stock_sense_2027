<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>StockSense - AI Predict & Explain</title>
    <meta name="description" content="Institutional-grade explainable AI stock analytics and quantitative market intelligence platform with real-time SHAP feature attribution, technical indicators, and risk simulation." />
    <meta property="og:title" content="StockSense - AI Predict & Explain" />
    <meta property="og:description" content="Institutional-grade explainable AI stock analytics and quantitative market intelligence platform with real-time SHAP feature attribution, technical indicators, and risk simulation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('stocksense_theme');
          var theme = saved || 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F5F8FC] dark:bg-[#08101e] text-slate-900 dark:text-slate-100 antialiased selection:bg-teal-500/20 selection:text-teal-900 min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
